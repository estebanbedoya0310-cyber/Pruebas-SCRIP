name: Compilar APK Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev libbz2-dev libsqlite3-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 virtualenv

      - name: Primer intento (descarga SDK)
        run: |
          yes | buildozer -v android debug || echo "Primera descarga OK, ahora aceptamos licencias"

      - name: Aceptar licencias Android
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          MANAGER=$(find $SDK_DIR -name sdkmanager -type f | head -n 1)
          echo "SDK Manager en: $MANAGER"
          yes | $MANAGER --licenses || true
          yes | $MANAGER --sdk_root=$SDK_DIR --licenses || true

      - name: Compilar APK final
        run: |
          buildozer -v android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageTrace-APK
          path: bin/*.apk
