name: Compilar APK Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          sudo apt update
          sudo apt install -y zip unzip git openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install "Cython==0.29.33" buildozer

      - name: Limpiar cache viejo
        run: rm -rf .buildozer

      - name: Compilar APK final
        run: |
          buildozer android debug || true
          echo "=== USANDO EL SDK DE GITHUB, NO EL DE BUILDOZER ==="
          echo $ANDROID_HOME
          ls $ANDROID_HOME/cmdline-tools/
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea84e4b" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "y" > $ANDROID_HOME/licenses/android-sdk-preview-license
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" "build-tools;33.0.2" "platforms;android-33"
          ls $ANDROID_HOME/build-tools/
          echo "=== COPIANDO BUILD-TOOLS 37 A LA CARPETA DE BUILDOZER ==="
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/
          cp -r $ANDROID_HOME/build-tools/37.0.0 $HOME/.buildozer/android/platform/android-sdk/build-tools/ || true
          cp -r $ANDROID_HOME/build-tools/33.0.2 $HOME/.buildozer/android/platform/android-sdk/build-tools/ || true
          ls $HOME/.buildozer/android/platform/android-sdk/build-tools/
          ls $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/
          echo "=== AHORA SI COMPILANDO ==="
          buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
